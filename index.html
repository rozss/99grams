<!DOCTYPE html>
<html lang="en-US">
<head>
  <!-- Meta Tags for SEO and Social Sharing -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="keywords" content="front-end web developer, unblocked games, programming, javascript, coding" />
  <meta name="description" content="Welcome to ud, a lightweight, fast, and clean game site." />
  <meta property="og:title" content="Welcome to ud lite, a fast game site" />

  <!-- External Stylesheet -->
  <style>
    body {
      background-color: #121212;
      color: #f07aff;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      line-height: 1.5;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    #subtitle {
      font-size: 1.5em;
    }

    p {
      max-width: 600px;
      margin: 20px auto;
    }

    button {
      cursor: pointer;
      padding: 15px 32px;
      font-size: 16px;
      font-weight: 500;
      text-align: center;
      text-decoration: none;
      border-radius: 30px;
      border: none;
      transition: background-color 0.3s ease;
      width: 220px;
      margin-top: 20px;
    }

    button:hover {
      background-color: #16b37b;
    }

    .green-btn {
      background-color: #22c55e;
      color: white;
    }

    .purple-btn {
      background-color: #b625cc;
      color: white;
    }

    footer {
      font-size: 0.9em;
      margin-top: 40px;
      color: #f07aff;
    }

    footer a {
      color: #f07aff;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <h1>ud</h1>

  <!-- Game Buttons -->
  <p>

    <a href="/misc.html"><button class="purple-btn">Tools and settings</button></a>
  </p>

  <!-- Footer Information -->

  </footer>

  <!-- Modern JavaScript -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Display message after page load
      const subtitle = document.getElementById('subtitle');
      subtitle.innerText = "Welcome to ud, enjoy the games!";
    });
  </script>
