<!DOCTYPE html>
<html lang="en-US">
<head>
  <title>Projects | ud</title>
  <meta name="keywords" content="front-end web developer, unblocked, games, google sites, unblocked games mom, ublocked, code, coding, programmer, development, javascript, jquery, bootstrap, sass, less, git" />
  <meta property="og:title" content="Welcome to ud lite, a lightweight, fast, and clean game site." />
  <meta property="og:site_name" content="ud.github.io" />
  <meta property="og:description" content="Welcome to ud lite, a lightweight, fast, and clean game site." />
  <meta name="description" content="Welcome to ud lite, a lightweight, fast, and clean game site." />
  <meta name="author" content="ud" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="shortcut-icon" href="/favicon.ico" />
  <script src="/js/main.js"></script>

  <!-- Google Font for Minecraft Style -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  
  <style>
    /* Global Styles */
    body {
      background-color: #121212; /* Dark background */
      color: #fff; /* White text */
      font-family: 'Press Start 2P', sans-serif; /* Minecraft-style font */
      text-decoration: none;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      font-size: 3rem;
      color: #f07aff; /* Bright purple */
      margin-top: 20px;
    }

    /* Search bar styling */
    input[type="text"] {
      width: 100%;
      font-size: 18px;
      padding: 6px 20px;
      margin: auto;
      border-radius: 30px;
      max-width: 600px;
      margin-bottom: 10px;
      background-color: #2c2c2c; /* Dark gray */
      color: #fff; /* White text */
      border: none;
    }

    /* Loader animation */
    #loader {
      display: block;
      border: 16px solid #f3f3f3;
      border-top: 16px solid #3498db;
      border-radius: 50%;
      width: 120px;
      height: 120px;
      animation: spin 0.3s linear infinite;
      margin: auto;
      margin-top: 1rem;
    }

    /* Game Tiles Styling */
    .game-link {
      height: 400px;
      width: 300px;
      text-decoration: none;
      margin: 10px;
      display: block;
    }

    .game-tile {
      background-color: #949494;
      height: 400px;
      width: 300px;
      border-radius: 30px;
      position: relative;
      overflow: hidden;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease;
    }

    .game-tile:hover {
      transform: scale(1.05);
    }

    .game-icon {
      border-radius: 30px;
      width: 300px;
      height: 300px;
      object-fit: cover;
    }

    .game-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #000000;
      text-align: center;
      margin-top: 10px;
    }

    .flex-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2rem;
    }

    /* Back to top button */
    #back-to-top {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #b625cc;
      color: #fff;
      border: none;
      border-radius: 50%;
      padding: 15px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #back-to-top:hover {
      transform: scale(1.1);
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Footer button */
    button {
      cursor: pointer;
      background-color: #22c55e;
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      border-radius: 20px;
      margin-top: 20px;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: translateY(-5px);
    }

    /* Responsive Design */
    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .game-tile {
        height: 300px;
        width: 220px;
      }

      .game-icon {
        width: 220px;
        height: 220px;
      }

      input[type="text"] {
        width: 80%;
      }
    }

    /* Keyframe for spinner */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <h1>Projects</h1>
  
  <!-- Search bar -->
  <input type="text" id="search" onkeyup="searchGames()" placeholder="Search for games..." />

  <!-- Loader -->
  <div id="loader"></div>

  <!-- Game container -->
  <div id="game-container" class="flex-container"></div>

  <!-- Footer -->
  <p class="text-center">
    <a href="/index.html" style="text-decoration: none;">
      <button>Go to the homepage</button>
    </a>
  </p>

  <!-- Back to Top Button -->
  <button id="back-to-top">&#8593;</button>

  <script>
    let games = [];
    fetch("config/games.json")
      .then((response) => response.json())
      .then((data) => {
        games = data;
        const container = document.getElementById("game-container");
        data.forEach((project) => {
          const game = document.createElement("a");
          game.href = project.link;
          game.className = "game-link";
          game.innerHTML = `
            <div class="game-tile">
              <img class="game-icon" src="${project.imgSrc}" alt="icon" />
              <p class="game-title">${project.title}</p>
            </div>`;
          container.appendChild(game);
        });
        document.getElementById("loader").style.display = "none";
      })
      .catch((error) => console.error("Error:", error));

    function searchGames() {
      const input = document.getElementById("search");
      const filter = input.value.toUpperCase();
      const container = document.getElementById("game-container");
      container.innerHTML = "";
      games
        .filter((game) => game.title.toUpperCase().includes(filter))
        .forEach((project) => {
          const game = document.createElement("a");
          game.href = project.link;
          game.className = "game-link";
          game.innerHTML = `
            <div class="game-tile">
              <img class="game-icon" src="${project.imgSrc}" alt="icon" loading="lazy" />
              <p class="game-title">${project.title}</p>
            </div>`;
          container.appendChild(game);
        });
    }

    const backToTopButton = document.getElementById('back-to-top');
    window.onscroll = function () {
      if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
        backToTopButton.style.display = "block";
      } else {
        backToTopButton.style.display = "none";
      }
    };

    backToTopButton.onclick = function () {
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    };
  </script>
</body>
</html>
